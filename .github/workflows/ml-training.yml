name: Exposure ML comparison
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ml-training.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: exposure-ml-${{ github.ref }}
  cancel-in-progress: true
jobs:
  paused:
    runs-on: self-hosted
    steps:
      - run: echo "Training paused by user. Rebuild the 135-case tunable-fractal core before a new training campaign."
